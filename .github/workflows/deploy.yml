name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Triggered by the Sanity webhook after content changes (see README "Sanity → automatischer Rebuild")
  repository_dispatch:
    types:
      - sanity-content-changed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages paths
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -f "public/CNAME" ]; then
            domain="$(tr -d '[:space:]' < public/CNAME)"
            echo "PUBLIC_SITE_URL=https://${domain}" >> "$GITHUB_ENV"
            echo "PUBLIC_BASE_PATH=/" >> "$GITHUB_ENV"
          elif [ "${repo}" = "${owner}.github.io" ]; then
            echo "PUBLIC_SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
            echo "PUBLIC_BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_SITE_URL=https://${owner}.github.io/${repo}" >> "$GITHUB_ENV"
            echo "PUBLIC_BASE_PATH=/${repo}" >> "$GITHUB_ENV"
          fi

      - name: Type check
        run: npm run check

      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.PUBLIC_FORMSPREE_ENDPOINT }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
